# ── Adding a wholly new CLI harness (harness: generic) ────────────────────────
#
# claude_code | codex | cursor | antigravity_cli each have a hardcoded dispatcher
# (exact CLI flags + output parsing) — the 4 built-in harnesses. A 5th/6th/Nth
# subprocess-based CLI needs no new TypeScript: `harness: generic` under `clis:`
# takes a `protocol:` block describing its invocation instead. Only reachable via
# an explicit clis: entry (never auto-detected) and requires both `command:` and
# `protocol:` — missing either skips the entry with a configWarnings entry.
#
# clis:
#   - name: my_custom_cli
#     harness: generic
#     command: my-cli               # binary, resolved on PATH like any other
#     tier: 3
#     protocol:
#       prompt_input: { mode: flag, flag: "-p" }   # or {mode: positional} / {mode: stdin}
#       working_dir: { flag: "--cd" }              # omit to rely on process cwd alone
#       model_flag: "--model"                      # omit if the CLI has no model override
#       extra_args: ["--json"]                     # always appended
#       safety_args:                                # extra args per requested safety profile
#         read_only: ["--mode", "plan"]
#         workspace_edit: ["--mode", "accept-edits"]
#         full_auto: ["--dangerously-skip-permissions"]
#       output_mode: json_field    # text | json_field | jsonl_stream
#       output_fields: [result, output, text]   # checked in order; dotted paths work
#
# What's genuinely templatable across CLIs (prompt input, working-dir flag, model
# flag, per-safety-profile args) is covered above. What isn't: each CLI's real
# streaming-event vocabulary (tool_use, thinking, etc.) — only the 4 built-in
# dispatchers have that. jsonl_stream is a best-effort approximation (concatenate
# a named field from each JSON line), not genuine feature parity — prefer text or
# json_field if the CLI supports a non-streaming output mode at all.
#
# Billing defaults to unknown/blocked (allow_paid_usage: true to opt in) — there's
# no way to know an arbitrary CLI's real billing model. Set billing_kind: and
# paid_usage_possible: explicitly once you know it, same as any other route.

# How long (seconds) to cache proactive quota check results.
quota_cache_ttl: 300

# Timeout (seconds) for subprocess / HTTP calls.
timeout_seconds: 120

# File to persist local call counts across restarts.
state_file: quota_state.json
