name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build before tests — the suite imports from dist/ (see ci.yml).
      - name: Build
        run: npm run build

      - name: Typecheck and test
        run: npm run check

      # ci.yml runs this on every push; the release gate must not check LESS
      # than ordinary CI does.
      - name: Smoke test
        run: npm run smoke

      - name: Inspect package contents
        run: npm pack --dry-run

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately no dependency cache in the job that publishes: npm's
      # trusted-publishing guidance is to skip package-manager caching in
      # release builds, so a poisoned cache entry can't reach the registry.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24 already
      # ships 11.x, but pinning latest removes any doubt about which patch
      # setup-node happened to resolve.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN — this authenticates via OIDC (trusted publishing),
      # configured on npmjs.com against this repo AND this workflow filename
      # (`publish.yml`, case-sensitive). There is no long-lived npm token
      # stored anywhere in this repo.
      #
      # The skip-if-already-published guard keeps the workflow idempotent:
      # 0.4.0 was bootstrap-published by hand (npm won't let you configure a
      # trusted publisher until the package exists), so tagging v0.4.0 after
      # the fact is a clean no-op instead of a hard EPUBLISHCONFLICT failure.
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "harness-dispatch@$VERSION" version >/dev/null 2>&1; then
            echo "harness-dispatch@$VERSION is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public --provenance
