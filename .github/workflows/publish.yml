name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate below asks whether this commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      # FIRST, and before anything expensive: has an independent acceptance
      # pass looked at this exact version, does CHANGELOG.md have a section for
      # it, and was the tag put on a commit that is on main?
      #
      # Every regression this project has shipped was found by such a pass and
      # none was missed — but each was already on npm when the pass ran,
      # because publishing came first. This makes the ordering mechanical
      # rather than remembered. See acceptance/README.md.
      - name: Acceptance record, changelog section, and main
        run: node scripts/check-acceptance.mjs "${GITHUB_REF_NAME#v}" --require-on-main

      - name: Install dependencies
        run: npm ci

      # The version is stamped from the tag HERE, before anything is checked or
      # packed, so the tarball that is verified below is byte for byte the one
      # the publish job ships.
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # No separate build step: `npm run check` runs `npm test`, which builds
      # before anything imports dist/ — the same as ci.yml.
      - name: Typecheck, lint and test
        run: npm run check

      # ci.yml runs this on every push; the release gate must not check LESS
      # than ordinary CI does.
      - name: Smoke test
        run: npm run smoke

      - name: Inspect package contents
        run: npm pack --dry-run

      # Pack, install the tarball into a scratch prefix and run what it
      # installed (--version, doctor, an MCP handshake). The .tgz stays in the
      # output directory and is what the publish job uploads to npm.
      - name: Verify the packed tarball
        run: node scripts/verify-tarball.mjs --out "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Deliberately no checkout, no dependency install and no build in the job
      # that holds the publish grant: it ships the tarball `verify` tested and
      # runs nothing else from the repository. (npm's trusted-publishing
      # guidance also says to skip package-manager caching in release builds.)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Pinned to an exact
      # version, not `latest`: this job holds the publish grant, so what it runs
      # should change only by a deliberate edit here. 12.0.2 was npm's latest
      # when the last successful publish (0.11.0, 2026-09-11) ran with
      # `npm@latest` — inferred from npm's release dates, as that run's log has
      # expired. Bump it on purpose.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@12.0.2
          npm --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package

      # No NODE_AUTH_TOKEN — this authenticates via OIDC (trusted publishing),
      # configured on npmjs.com against this repo AND this workflow filename
      # (`publish.yml`, case-sensitive). There is no long-lived npm token
      # stored anywhere in this repo.
      #
      # The skip-if-already-published guard keeps the workflow idempotent:
      # 0.4.0 was bootstrap-published by hand (npm won't let you configure a
      # trusted publisher until the package exists), so tagging v0.4.0 after
      # the fact is a clean no-op instead of a hard EPUBLISHCONFLICT failure.
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "harness-dispatch@$VERSION" version >/dev/null 2>&1; then
            echo "harness-dispatch@$VERSION is already on npm — nothing to publish."
            exit 0
          fi
          npm publish "./package/harness-dispatch-$VERSION.tgz" --access public --provenance

  # A DRAFT release, never a public one: the draft is the review gate, so the
  # notes are there to read and the button stays with a person.
  draft-release:
    name: Draft GitHub release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the draft from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists — leaving it alone."
            exit 0
          fi
          # One line per paragraph: a release body renders every newline as a
          # line break, and CHANGELOG.md is hard-wrapped (see the script).
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
