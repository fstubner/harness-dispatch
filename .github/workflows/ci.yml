name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          # One leg on the CLAIMED Node floor (engines: >=22.22.2). Every
          # other leg runs 24, so without this the floor was advertised but
          # never exercised anywhere.
          - os: ubuntu-latest
            node: "22"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build BEFORE tests: tests/smoke-agents.test.ts imports
      # scripts/smoke-agents.mjs, which imports from dist/ — on a fresh
      # checkout the suite fails without a prior build (caught by the very
      # first cross-platform run of this workflow).
      - name: Build
        run: npm run build

      - name: Typecheck and test
        run: npm run check

      - name: Smoke test
        run: npm run smoke

      - name: Inspect package contents
        run: npm pack --dry-run
