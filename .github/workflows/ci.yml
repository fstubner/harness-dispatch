name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build BEFORE tests: tests/smoke-agents.test.ts imports
      # scripts/smoke-agents.mjs, which imports from dist/ — on a fresh
      # checkout the suite fails without a prior build (caught by the very
      # first cross-platform run of this workflow).
      - name: Build
        run: npm run build

      - name: Typecheck and test
        run: npm run check

      - name: Smoke test
        run: npm run smoke

      - name: Inspect package contents
        run: npm pack --dry-run
